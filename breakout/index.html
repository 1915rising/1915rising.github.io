<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Breakout — 1915 Arcade</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", system-ui, sans-serif;
    background: #0b0e1a;
    color: #e8eaf6;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .topbar {
    width: 100%;
    max-width: 560px;
    padding: 18px 16px 0;
  }
  .back {
    color: #ffd54f;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.95rem;
  }
  .back:hover { text-decoration: underline; }
  h1 {
    text-align: center;
    font-size: 2rem;
    letter-spacing: 2px;
    color: #ffd54f;
    margin: 10px 0 4px;
    text-shadow: 0 0 14px rgba(255, 213, 79, 0.3);
  }
  .hud {
    display: flex;
    justify-content: space-between;
    width: 480px;
    max-width: 92vw;
    padding: 8px 2px;
    font-size: 1rem;
    font-weight: 600;
  }
  .hud span { color: #9fa8c9; font-weight: 400; }
  .hud b { color: #e8eaf6; }
  canvas {
    background: #10142a;
    border: 1px solid #262e52;
    border-radius: 8px;
    max-width: 92vw;
    height: auto;
    touch-action: none;
  }
  .help {
    color: #9fa8c9;
    font-size: 0.9rem;
    margin: 12px 16px 30px;
    text-align: center;
    line-height: 1.5;
  }
</style>
</head>
<body>
  <div class="topbar">
    <a class="back" href="../">&larr; Back to 1915 Arcade</a>
  </div>

  <h1>BREAKOUT</h1>

  <div class="hud">
    <div><span>Score</span> <b id="score">0</b></div>
    <div><span>Level</span> <b id="level">1</b></div>
    <div><span>Lives</span> <b id="lives">3</b></div>
  </div>

  <canvas id="game" width="480" height="600"></canvas>

  <p class="help">
    Move the paddle with your <b>mouse</b> or the <b>&larr; &rarr; arrow keys</b>.<br>
    Press <b>Space</b> or <b>click</b> to launch the ball. Clear every brick to reach the next level — each level is faster.
  </p>

  <script src="game.js"></script>
</body>
</html>
